# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Cache the smoke test's OCI layout so a docker.io outage or anonymous
      # rate limit cannot fail the job: the image is pinned by index digest, so
      # the cache never goes stale and the registry is contacted at most once
      # per arch.
      - uses: actions/cache@v6
        with:
          path: .smoke-layout
          key: smoke-layout-${{ matrix.arch }}-fd8d9aa63ba2
      # Run the make targets inside the same dev container developers use
      # (.devcontainer), so the toolchain is identical locally and in CI.
      # The trailing install keeps INSTALL.md's from-source path honest; it
      # reuses the just-built binary, so it costs nothing.
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: >-
            SMOKE_IMAGE=docker.io/library/busybox@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
            SMOKE_LAYOUT="$PWD/.smoke-layout"
            make build test smoke install DESTDIR=/tmp/install-check
            && test -x /tmp/install-check/usr/local/bin/knarr
          push: never

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: make lint
          push: never
