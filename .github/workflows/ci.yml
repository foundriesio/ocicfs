# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Cache the end-to-end test's OCI layout so a docker.io outage or anonymous
      # rate limit cannot fail the job: the image is pinned by index digest, so
      # the cache never goes stale and the registry is contacted at most once
      # per arch.
      - uses: actions/cache@v6
        with:
          path: .e2e-layout
          key: e2e-layout-${{ matrix.arch }}-fd8d9aa63ba2
      # Build a tiny image for the runner's platform with its docker buildx
      # into an OCI archive, so the end-to-end test pulls a real buildx archive
      # with --from-tar. The default docker driver cannot export OCI, hence
      # the docker-container builder. The image needs no base, so no
      # registry is contacted.
      - run: |
          mkdir -p .buildx
          docker buildx create --name oci-export --driver docker-container
          docker buildx build --builder oci-export --platform linux/${{ matrix.arch }} \
            -o type=oci,dest=.buildx/oci.tar,name=example.com/buildx-e2e:1 - <<'EOF'
          FROM scratch
          COPY <<HELLO /hello
          built by docker buildx
          HELLO
          EOF
      # Run the make targets inside the same dev container developers use
      # (.devcontainer), so the toolchain is identical locally and in CI.
      # The trailing install keeps INSTALL.md's from-source path honest; it
      # reuses the just-built binary, so it costs nothing.
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: >-
            E2E_IMAGE=docker.io/library/busybox@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
            E2E_LAYOUT="$PWD/.e2e-layout"
            E2E_ARCHIVE="$PWD/.buildx/oci.tar"
            make build test test-e2e install DESTDIR=/tmp/install-check
            && test -x /tmp/install-check/usr/local/bin/ocicfs
          push: never

  # The tagged fs-verity build modes change whether a pull writes objects with
  # fs-verity and a mount requires it, so their unit tests run in a build of
  # each mode; the default (auto) build runs above.
  build-modes:
    name: vet & test (${{ matrix.tags }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tags: [ocicfs_verity_required, ocicfs_verity_off]
    steps:
      - uses: actions/checkout@v7
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: make GOFLAGS=-tags=${{ matrix.tags }} vet test
          push: never

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: make lint
          push: never
