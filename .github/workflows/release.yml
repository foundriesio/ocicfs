# SPDX-License-Identifier: Apache-2.0
#
# Release pipeline. Two modes:
#  - a v* tag push builds, validates, and publishes a GitHub release
#    (draft until every asset is attached, so an interrupted run never
#    leaves a visible half-release);
#  - a pull request touching packaging/release files, or a manual
#    dispatch, runs the identical build and validation as a snapshot and
#    publishes nothing.
# Third-party actions are pinned to full commit SHAs (tag in the comment).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - debian/**
      - Makefile
      - .github/workflows/release.yml
      - scripts/release-artifacts.sh
      - scripts/release-check.sh
      - scripts/deb-test.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # actions/checkout replaces annotated tags with lightweight ones and
      # fetches a single ref; the force-fetch restores the real tag objects
      # and the full tag list that version derivation and the release-notes
      # steps read.
      - name: Restore tags
        run: git fetch --tags --force

      - name: Validate the release tag
        if: github.event_name == 'push'
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
            || { echo "not a release tag: $GITHUB_REF_NAME" >&2; exit 1; }

      # Same smoke-layout cache as ci.yml: the image is pinned by index
      # digest, so the registry is contacted at most once per arch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .smoke-layout
          key: smoke-layout-${{ matrix.arch }}-fd8d9aa63ba2

      # Build and test the exact tagged revision in the same dev container
      # CI uses; tags do not trigger ci.yml, so this is the test gate. The
      # trailing install exercises INSTALL.md's from-source path.
      - name: Build and test in the dev container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          runCmd: >-
            GOFLAGS=-mod=readonly
            SMOKE_IMAGE=docker.io/library/busybox@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
            SMOKE_LAYOUT="$PWD/.smoke-layout"
            make build test smoke size install DESTDIR=/tmp/install-check
            && test -x /tmp/install-check/usr/local/bin/knarr
          push: never

      # The dev container runs as root, leaving bin/ and .smoke-layout
      # root-owned on the host; later host-side steps write under bin/.
      - name: Reclaim workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Compute versions
        id: ver
        run: |
          echo "expected=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "artifact=$(./scripts/release-artifacts.sh version)" >> "$GITHUB_OUTPUT"

      - name: Validate the binary
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.expected }}
          EXPECTED_REVISION: ${{ steps.ver.outputs.revision }}
        run: ./scripts/release-check.sh binary ${{ matrix.arch }}

      - name: Build and test the deb
        run: make deb deb-lint deb-test

      - name: Assemble and validate the archive
        run: |
          ./scripts/release-artifacts.sh archive ${{ matrix.arch }}
          ./scripts/release-check.sh archive \
            "dist/knarr_${{ steps.ver.outputs.artifact }}_linux_${{ matrix.arch }}.tar.gz" \
            ${{ matrix.arch }}

      # INSTALL.md's archive steps on clean containers — alpine has no
      # glibc, so this also proves the static-linkage claim at runtime.
      - name: Install-test the archive
        run: |
          ./scripts/release-check.sh install \
            "dist/knarr_${{ steps.ver.outputs.artifact }}_linux_${{ matrix.arch }}.tar.gz"

      - name: Generate the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: bin/knarr
          format: spdx-json
          output-file: dist/knarr_${{ steps.ver.outputs.artifact }}_linux_${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Collect the deb
        run: cp bin/deb/knarr_*.deb dist/

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: knarr-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  create-release:
    # Tag pushes only: a workflow_dispatch run from a tag ref must never
    # publish, and published releases are immutable — a failed run is
    # recovered by re-running its failed jobs, never by re-running the
    # whole workflow (see RELEASING.md).
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Restore tags
        run: git fetch --tags --force

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          merge-multiple: true

      # Generate, then verify the same way INSTALL.md tells users to.
      - name: Generate and verify checksums
        run: |
          ./scripts/release-artifacts.sh checksums
          cd dist && sha256sum --check --ignore-missing knarr_*_checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Verify an attestation the same way INSTALL.md tells users to,
      # before anything publishes.
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/knarr_*.tar.gz dist/knarr_*.deb; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done

      # Release body = the annotated tag message (the maintainer-written
      # summary, see RELEASING.md), plus GitHub-generated notes only when a
      # previous stable release exists to diff against — so the first
      # release carries the hand-written summary alone, and rc tags never
      # serve as the comparison base.
      - name: Assemble release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME"
            echo
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
          } > notes.md
          prev=$(git tag --list 'v*' --sort=-version:refname \
            | grep -Ev -- '-rc\.' | grep -Fxv "$GITHUB_REF_NAME" | head -n 1 || true)
          if [ -n "$prev" ]; then
            printf '\n---\n\n' >> notes.md
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" -f previous_tag_name="$prev" \
              --jq .body >> notes.md
          fi
          grep -q '[^[:space:]]' notes.md || echo "knarr $GITHUB_REF_NAME" > notes.md

      - name: Create the draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
